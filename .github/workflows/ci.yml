# Every push and pull request: Go and Python build, lint, tests and security checks, the OpenAPI files, both images,
# and the lab stack started from them --> nothing is pushed here, release.yml publishes images
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # version go.mod declares, and the newest the images build with
        go: ["1.24.x", "stable"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "${{ matrix.go }}" }
      # 5G NR LDPC's matrix work runs in Python (ec/ldpc5g.py), so its tests need numpy and the codes
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ec/requirements.txt }
      - run: pip install -r ec/requirements.txt
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go mod tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - run: go build ./...
      - name: test (race)
        env: { QKD_EC_PYTHON: python }
        run: go test -race -count=1 ./...
      # guards the amd64-CLMUL / portable-fallback split: every target must at least compile
      - name: cross-arch build
        if: matrix.go == 'stable'
        run: |
          for pair in linux/arm64 linux/386 linux/amd64 darwin/arm64 windows/amd64; do
            GOOS="${pair%/*}" GOARCH="${pair#*/}" go build -o /dev/null ./...
          done

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: stable }
      - uses: golangci/golangci-lint-action@v8
        with: { version: v2.15.0 }

  go-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: stable }
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      # gosec's taint findings need a person's judgement: reported to code scanning, never failing the build
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -no-fail -fmt sarif -out gosec.sarif ./...
      - uses: github/codeql-action/upload-sarif@v3
        if: github.event_name == 'push'
        with: { sarif_file: gosec.sarif, category: gosec }

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "services/requirements.txt\nec/requirements.txt" }
      - run: pip install -r services/requirements.txt -r ec/requirements.txt ruff openapi-spec-validator
      - name: ruff
        run: ruff check .
      - name: OpenAPI files
        run: for f in api/*.yaml; do openapi-spec-validator "$f"; done
      - name: services
        run: python -m unittest services.tests.test_services -v
      - name: acquisition
        working-directory: acquisition
        run: python -m unittest test_live_peak test_coincidence_logger test_two_party_blocks test_two_party_stream test_clock_tracker -v

  images:
    runs-on: ubuntu-latest
    needs: [go, python]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: kms image
        uses: docker/build-push-action@v6
        with: { context: ., target: kms, load: true, tags: "qkd_post_processing/kms:ci", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: app image
        uses: docker/build-push-action@v6
        with: { context: ., target: app, load: true, tags: "qkd_post_processing/app:lab", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: controller answers
        run: |
          docker run -d --name controller --entrypoint controller -p 18080:8080 qkd_post_processing/kms:ci -state=/tmp/network.json -insecure-plain-http
          for i in $(seq 30); do curl -fsS http://127.0.0.1:18080/healthz && break; sleep 1; done
          curl -fsS -X PUT -H 'X-Dev-Role: operator' -d '{"site":"A"}' http://127.0.0.1:18080/v1/nodes/A
      # the four services from one image, each on its own port, reached through the web service
      - name: lab stack
        run: |
          docker compose -f deploy/lab.yml up -d --no-build --wait --wait-timeout 180
          for path in / /healthz /api/status /api/recordings /api/alerts /api/jobs /api/controller; do
            curl -fsS -o /dev/null -w "%{http_code} $path\n" "http://127.0.0.1:9823$path"
          done
      - name: logs on failure
        if: failure()
        run: docker compose -f deploy/lab.yml logs --tail=100; docker logs controller || true
